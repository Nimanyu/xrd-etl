[project]
name = "mseml"
version = "0.2.0"
description = "EMA 5937 template"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.2",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mseml"]

[tool.ruff]
line-length = 100
